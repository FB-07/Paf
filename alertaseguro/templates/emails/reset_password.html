<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial; background-color:#f5f5f5; padding:20px;">
    
    <div style="max-width:500px; margin:auto; background:white; padding:20px; border-radius:10px; text-align:center;">
        
        <img src="{{ domain }}/static/imagens/logoPreto.png" alt="Logo" width="180" style="margin-bottom:10px;">

        <h2>Redefinir a tua password</h2>

        <p>Olá {{ user.username }},</p>
        <p>Clica no botão abaixo para redefinir a tua password:</p>

        <a href="{{ link }}" style="
            display:inline-block;
            padding:12px 20px;
            background:#ef4444;
            color:white;
            text-decoration:none;
            border-radius:8px;
            margin-top:10px;
        ">
            Redefinir password
        </a>

        <p style="margin-top:30px; font-size:12px; color:gray;">
            Se o botão não funcionar, usa este link:<br>
            {{ link }}
        </p>

    </div>

</body>
</html>
