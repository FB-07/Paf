{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Perfil</title>
  <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
</head>

<body class="m-0 p-0 bg-gray-100 font-sans caret-transparent">

{% include "components/header.html" %}

{% include "components/menulateral.html" %}

    <div class="mt-[150px] w-full flex justify-center">
      <div class="bg-[#ffffffcc] w-[500px] p-[30px] rounded-[25px] shadow-[0_4px_10px_rgba(0,0,0,0.2)]">
        <h2 class="text-[#9c1717] mb-[20px] text-[28px] font-bold text-center">Perfil do Utilizador</h2>

        <div class="mb-[15px]">
      <label class="block text-[16px] text-gray-600 mb-[5px] font-bold">Utilizador</label>
      <p class="font-normal text-sm border border-gray-300 rounded-[10px] p-[10px] text-gray-700">
        {{ user.username }}
      </p>
    </div>

    <div class="mb-[15px]">
      <label class="block text-[16px] text-gray-600 mb-[5px] font-bold">Email</label>
      <p class="font-normal text-sm border border-gray-300 rounded-[10px] p-[10px] text-gray-700">
        {% if user.email %}
          {{ user.email }}
        {% else %}
          <span class="text-gray-500 underline">Email não definido</span>
        {% endif %}
      </p>
    </div>

    <div class="mb-[15px]">
      <label class="block text-[16px] text-gray-600 mb-[5px] font-bold">Password</label>
      <p class="font-normal text-sm border border-gray-300 rounded-[10px] p-[10px] text-gray-700">
        ●●●●●●●●●
      </p>
    </div>

    <div class="mb-[20px]">
      <label class="block text-[16px] text-gray-600 mb-[5px] font-bold">Conta criada</label>
      <p class="font-normal text-sm border border-gray-300 rounded-[10px] p-[10px] text-gray-700">
        {{ user.date_joined }}
      </p>
    </div>

    <div class="text-center">
      <a href="{% url 'editar_perfil' %}" class="inline-block px-[25px] py-[12px] mt-[25px] bg-[#c62828] text-white rounded-[12px] no-underline text-[18px] transition duration-200 hover:bg-[#ff4444] hover:scale-105">Editar Perfil</a>
      <a href="{% url 'logout' %}" class="inline-block px-[25px] py-[12px] mt-[25px] bg-[#c62828] text-white rounded-[12px] no-underline text-[18px] transition duration-200 hover:bg-[#ff4444] hover:scale-105">Logout</a>
      <a href="{% url 'mainpage' %}" class="inline-block px-[25px] py-[12px] mt-[25px] bg-[#c62828] text-white rounded-[12px] no-underline text-[18px] transition duration-200 hover:bg-[#ff4444] hover:scale-105">Voltar</a>
    </div>
</div>

<script src="{% static 'js/menulateral.js' %}"></script>

</body>
</html>
