<form method="GET" class="mb-6 flex justify-center">

  <div class="flex w-full md:w-[500px] shadow-[0_4px_10px_rgba(0,0,0,0.1)] rounded-[15px] overflow-hidden">

    <input
      type="text"
      name="q"
      value="{{ request.GET.q }}"
      placeholder="Pesquisar..."
      class="w-full p-3 outline-none text-gray-700"
    >

    <button
      type="submit"
      class="bg-[#b43030] text-white px-6 font-semibold"
    >
      Pesquisar
    </button>

  </div>

</form>
