<button id="menu-btn"
  class="fixed top-4 right-8 z-[100000]
         text-white text-[35px]
         cursor-pointer
         transition-transform duration-200">
  ☰
</button>

<nav id="side-menu"
  class="fixed top-0 right-0 h-full w-0 overflow-hidden
         bg-gradient-to-b from-[#b43030] via-[#ff1e00] to-[#9c1717]
         transition-all duration-300
         z-[99999]">

  <div class="pt-24 flex flex-col text-xl">
    <a href="{% url 'mainpage' %}" class="block px-[20px] py-[12px] text-white font-bold transition hover:text-black hover:bg-[#ffdddd] no-underline">Home</a>
    <a href="{% url 'precaucoes' %}" class="block px-[20px] py-[12px] text-white font-bold transition hover:text-black hover:bg-[#ffdddd] no-underline">Precauções</a>
    <a href="{% url 'doacoes' %}" class="block px-[20px] py-[12px] text-white font-bold transition hover:text-black hover:bg-[#ffdddd] no-underline">Doações</a>
    <a href="{% url 'sobre' %}" class="block px-[20px] py-[12px] text-white font-bold transition hover:text-black hover:bg-[#ffdddd] no-underline">Sobre nós</a>
    <a href="{% url 'avisos' %}" class="block px-[20px] py-[12px] text-white font-bold transition hover:text-black hover:bg-[#ffdddd] no-underline">Avisos</a>

    {% if user.is_authenticated %}
      <p class="text-white pl-[15px] py-[12px]">Olá, <b>{{ user.username }}</b></p>
      <a href="{% url 'perfil' %}" class="block px-[20px] py-[12px] text-white font-bold transition hover:text-black hover:bg-[#ffdddd] no-underline">Perfil</a>
    {% else %}
      <a href="{% url 'login' %}" class="block px-[20px] py-[12px] text-white font-bold transition hover:text-black hover:bg-[#ffdddd] no-underline">Entrar</a>
      <a href="{% url 'registo' %}" class="block px-[20px] py-[12px] text-white font-bold transition hover:text-black hover:bg-[#ffdddd] no-underline">Registar</a>
    {% endif %}
  </div>
</nav>
