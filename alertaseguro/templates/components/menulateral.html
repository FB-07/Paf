<button id="menu-btn"
  class="fixed top-3 sm:top-4 right-4 sm:right-8 z-[100000]
         text-white text-[26px] sm:text-[32px]
         cursor-pointer transition-transform duration-200">
  ☰
</button>

<nav id="side-menu"
  class="fixed top-0 right-0 h-full w-0 overflow-hidden
         bg-gradient-to-b from-[#b43030] via-[#ff1e00] to-[#9c1717]
         transition-all duration-300 z-[99999]">

  <div class="pt-19 flex flex-col text-lg sm:text-xl">

    <!-- 🔹 GERAL -->
    <div>
      <button onclick="toggleSubmenu('submenu-geral')"
        class="w-full flex justify-between items-center px-[20px] py-[12px] text-white font-bold hover:text-black hover:bg-[#ffdddd] transition">
        Geral
        <span id="arrow-submenu-geral">&gt;</span>
      </button>

      <div id="submenu-geral" class="hidden flex flex-col ml-4">
        <a href="{% url 'mainpage' %}" class="px-[20px] py-[10px] text-white font-bold hover:bg-[#ffdddd] hover:text-black">Home</a>
        <a href="{% url 'tabela' %}" class="px-[20px] py-[10px] text-white font-bold hover:bg-[#ffdddd] hover:text-black">Tabela</a>
        <a href="{% url 'precaucoes' %}" class="px-[20px] py-[10px] text-white font-bold hover:bg-[#ffdddd] hover:text-black">Precauções</a>
        <a href="{% url 'doacoes' %}" class="px-[20px] py-[10px] text-white font-bold hover:bg-[#ffdddd] hover:text-black">Doações</a>
      </div>
    </div>

    <!-- 🔹 INFORMAÇÃO -->
    <div>
      <button onclick="toggleSubmenu('submenu-info')"
        class="w-full flex justify-between items-center px-[20px] py-[12px] text-white font-bold hover:text-black hover:bg-[#ffdddd] transition">
        Informação
        <span id="arrow-submenu-info">&gt;</span>
      </button>

      <div id="submenu-info" class="hidden flex flex-col ml-4">
        <a href="{% url 'sobre' %}" class="px-[20px] py-[10px] text-white font-bold hover:bg-[#ffdddd] hover:text-black">Sobre nós</a>
        <a href="{% url 'avisos' %}" class="px-[20px] py-[10px] text-white font-bold hover:bg-[#ffdddd] hover:text-black">Avisos</a>
        <a href="{% url 'informacao' %}" class="px-[20px] py-[10px] text-white font-bold hover:bg-[#ffdddd] hover:text-black">Informação</a>
        <a href="{% url 'feedback' %}" class="px-[20px] py-[10px] text-white font-bold hover:bg-[#ffdddd] hover:text-black">Feedback</a>
      </div>
    </div>

    <!-- 🔹 CONTA -->
    <div>
      <button onclick="toggleSubmenu('submenu-conta')"
        class="w-full flex justify-between items-center px-[20px] py-[12px] text-white font-bold hover:text-black hover:bg-[#ffdddd] transition">
        Conta
        <span id="arrow-submenu-conta">&gt;</span>
      </button>

      <div id="submenu-conta" class="hidden flex flex-col ml-4">

        {% if user.is_authenticated %}
          <p class="text-white pl-[20px] py-[8px]">Olá, <b>{{ user.username }}</b></p>
          <a href="{% url 'perfil' %}" class="px-[20px] py-[10px] text-white font-bold hover:bg-[#ffdddd] hover:text-black">Perfil</a>
        {% else %}
          <a href="{% url 'login' %}" class="px-[20px] py-[10px] text-white font-bold hover:bg-[#ffdddd] hover:text-black">Entrar</a>
          <a href="{% url 'registo' %}" class="px-[20px] py-[10px] text-white font-bold hover:bg-[#ffdddd] hover:text-black">Registar</a>
        {% endif %}

      </div>
    </div>

    <!-- 🔹 ADMIN -->
    {% if user.is_authenticated and user.is_staff %}
    <div>
      <button onclick="toggleSubmenu('submenu-admin')"
        class="w-full flex justify-between items-center px-[20px] py-[12px] text-white font-bold hover:text-black hover:bg-[#ffdddd] transition">
        Admin
        <span id="arrow-submenu-admin">&gt;</span>
      </button>

      <div id="submenu-admin" class="hidden flex flex-col ml-4">
        <a href="{% url 'admin_reports' %}" class="px-[20px] py-[10px] text-white font-bold hover:bg-[#ffdddd] hover:text-black">Reports</a>
        <a href="/admin" class="px-[20px] py-[10px] text-white font-bold hover:bg-[#ffdddd] hover:text-black">Django Admin</a>
      </div>
    </div>
    {% endif %}

  </div>
</nav>
