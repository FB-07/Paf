{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Perfil</title>
  <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
</head>

<body class="m-0 p-0 bg-[#bfe3f0] font-sans caret-transparent">

{% include "components/header.html" %}

{% include "components/menulateral.html" %}

<div class="mt-[150px] w-full flex justify-center">
  <div class="bg-[#ffffffcc] w-[500px] p-[30px] rounded-[25px] shadow-[0_4px_10px_rgba(0,0,0,0.2)] text-center">
    <h2 class="text-[#9c1717] mb-[20px] text-[28px] font-bold">Perfil do Utilizador</h2>

    <p class="text-[18px] my-[10px]"><b>Utilizador:</b> {{ user.username }} <a href="#" class="text-[#9c1717] font-bold no-underline">Change</a></p>
    <p class="text-[18px] my-[10px]"><b>Password:</b> ●●●●●●●●● <a href="#" class="text-[#9c1717] font-bold no-underline">Change</a></p>
    <p class="text-[18px] my-[10px]"><b>Email:</b> {{ user.email }} <a href="#" class="text-[#9c1717] font-bold no-underline">Change</a></p>
    <p class="text-[18px] my-[10px]"><b>Conta criada:</b> {{ user.date_joined }}</p>

    <a href="{% url 'logout' %}" class="inline-block px-[25px] py-[12px] mt-[25px] bg-[#c62828] text-white rounded-[12px] no-underline text-[18px] transition duration-200 hover:bg-[#ff4444] hover:scale-105">Logout</a>
    <a href="{% url 'mainpage' %}" class="inline-block px-[25px] py-[12px] mt-[25px] bg-[#c62828] text-white rounded-[12px] no-underline text-[18px] transition duration-200 hover:bg-[#ff4444] hover:scale-105">Voltar</a>
  </div>
</div>

<script src="{% static 'js/menulateral.js' %}"></script>

</body>
</html>
