{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>{% block title %}AlertaSeguro{% endblock %}</title>

    {% block meta %}
    
    {% endblock %}

    {% block css %}
    <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
    {% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">

{% if messages %}
  <div class="fixed top-[80px] sm:bottom-[80px] right-4 z-[9999] space-y-2">
    {% for message in messages %}

        <div class="toast px-4 py-3 rounded-lg shadow-lg text-white
                    {% if message.tags == 'success' %}bg-green-600
                    {% elif message.tags == 'error' %}bg-red-600
                    {% elif message.tags == 'warning' %}bg-yellow-500
                    {% else %}bg-blue-600{% endif %}">

            {{ message }}
        </div>

    {% endfor %}
  </div>
{% endif %}

{% block content %}

{% endblock %}

{% block js %}

<script src="{% static 'js/admin.js' %}"></script>    
<script src="{% static 'js/toast.js' %}"></script>
<script src="{% static 'js/menulateral.js' %}"></script>
<script src="{% static 'js/sub-menu.js' %}"></script>

{% endblock %}

</body>
</html>
